name: E1 calidad
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-e1.txt
      - run: python -m pytest -q
      - run: python -m pipeline.ejecutar
      - run: python -m pipeline.estadistica
      - uses: actions/upload-artifact@v4
        with:
          name: e1-reporte-calidad
          path: |
            data/oro/reporte_calidad.json
            data/oro/comparacion_modelos.csv
            data/oro/diagnostico_series.json
