name: E1 calidad
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-e1.txt pip-audit
      - name: Linter Ruff
        run: python -m ruff check pipeline tests
      - name: Auditoría de dependencias
        run: python -m pip_audit -r requirements-e1.txt
      - run: python -m pipeline.ejecutar
      - run: python -m pytest -q
      - run: python -m pipeline.estadistica
      - run: python -m pipeline.analisis_e1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-reporte-calidad
          path: |
            data/oro/reporte_calidad.json
            data/oro/comparacion_modelos.csv
            data/oro/diagnostico_series.json
            data/oro/diagnostico_ampliado.csv
            data/oro/diagnostico_preprocesamiento.json
            data/oro/pronosticos_exploratorios.csv
          if-no-files-found: warn
