
name: E1 y E2 calidad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements-e1.txt pip-audit

      - name: Linter Ruff
        run: python -m ruff check pipeline tests

      - name: Auditoría de dependencias
        run: python -m pip_audit -r requirements-e1.txt

      - name: Ejecutar pipeline Bronce-Plata-Oro
        run: python -m pipeline.ejecutar

      - name: Generar modelos y linaje analítico E2
        run: python -m pipeline.ejecutar_analisis

      - name: Ejecutar pruebas automatizadas
        run: python -m pytest -q

      - name: Restaurar linaje analítico tras las pruebas
        run: python -m pipeline.linaje_analitico_e2

      - name: Publicar artefactos de calidad
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-e2-reporte-calidad
          path: |
            data/oro/reporte_calidad.json
            data/oro/comparacion_modelos.csv
            data/oro/diagnostico_series.json
            data/oro/diagnostico_ampliado.csv
            data/oro/diagnostico_preprocesamiento.json
            data/oro/pronosticos_exploratorios.csv
          if-no-files-found: warn
